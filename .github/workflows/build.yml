name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "== Repo files =="
          ls -la
          if [ ! -f settings.gradle ] || [ ! -d app ]; then
            ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::Repo mein koi zip file nahi hai. Pehle zip upload karein."
              exit 1
            fi
            echo "== Using zip: $ZIP =="
            unzip -l "$ZIP
